appId: com.mthoodlanes.scheduler
productName: Mt Hood Lanes Scheduler
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
win:
  target: nsis
  artifactName: '${productName}-${version}-setup.${ext}'
mac:
  target: dmg
  category: public.app-category.business
linux:
  target: AppImage
  category: Office
npmRebuild: false

services:
  - type: web
    name: mt-hood-lanes-scheduler-backend
    runtime: node
    plan: free
    region: oregon
    # Milestone 20: `--include=dev` overrides npm's NODE_ENV-driven default of
    # skipping devDependencies during `npm ci` (verified locally: with
    # NODE_ENV=production set, a plain `npm ci` silently omits
    # devDependencies) — required here because `npm run build` needs
    # typescript/vite/electron-vite, all devDependencies, to produce
    # `out/renderer` (the static files Express now serves) before
    # `server:build` compiles the server itself.
    # `&& npm run db:migrate` is deliberately tacked onto buildCommand rather
    # than using `preDeployCommand` — Render does not support
    # `preDeployCommand` on the free plan at all; it's silently a no-op there
    # (confirmed the hard way: migrations 0007-0009 never actually applied to
    # production despite being wired into `preDeployCommand`, and the login
    # route broke in production querying a column that build-time code
    # assumed existed). Running it here means any pending
    # `server/drizzle/*.sql` migration is still applied automatically before
    # the new instance starts, just as part of the build step instead of a
    # separate pre-deploy phase — this was previously a manual,
    # easy-to-forget step (see the "schedule_publications" table missing in
    # production despite its migration being generated and committed).
    buildCommand: npm ci --include=dev && npm run build && npm run server:build && npm run db:migrate
    startCommand: npm run server:start
    envVars:
      - key: DATABASE_URL
        sync: false
      # Milestone 20: explicit rather than relying on Render's own default,
      # since both the dev-CORS gate and the session cookie's `secure` flag
      # (server/src/index.ts, server/src/auth/cookie.ts) branch on this, and
      # dev CORS must never be reachable in production under any
      # circumstance.
      - key: NODE_ENV
        value: production
